[package]
name = "spark-browser"
version = "0.1.4"
description = "Open-source modern web browser built with Rust (Tauri v2) and Svelte"
license = "Apache-2.0"
authors = ["Open-Source Contributors"]
edition = "2021"

[lib]
name = "spark_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
adblock = { version = "0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "content-blocking"] }
quick-xml = "0.42"
dirs = "7"
tauri = { version = "2", features = ["unstable", "macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
url = "2.5"
window-vibrancy = "0.8"
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache", "fallible_uint", "functions"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tempfile = "3"
sha2 = "0.10"
unicode-normalization = "0.1"
base64 = "0.22"
png = "0.17"
getrandom = "0.3"
flate2 = "1.1"
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = "1"
tokio = { version = "1", features = ["sync", "macros", "time", "fs", "io-util", "net", "rt"] }
hmac = "0.12"
sha1 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
rqrr = "0.11.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = ["Devices_Geolocation", "Foundation", "Security_Credentials", "Security_Cryptography", "Storage_Streams", "Win32_Security_Credentials", "Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Media_Audio", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Kernel", "Win32_System_JobObjects"] }
tauri-plugin-updater = "~2.14.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"
libc = "0.2"
gtk = "0.18"
javascriptcore-rs = "1.1"
cairo-rs = { version = "0.18", features = ["png"] }
webkit2gtk = { version = "2.0", features = ["v2_24"] }
soup3 = "0.5"
webkit2gtk-sys = { version = "2.0", features = ["v2_24"] }

[dev-dependencies]
libloading = "0.8"
qrcode = { version = "0.15.0", default-features = false, features = ["image"] }
tauri = { version = "2", features = ["test"] }

# Faster startup and smaller binary: fewer page faults when the executable loads.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

