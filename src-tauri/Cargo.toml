[package]
name = "veloce-browser"
version = "0.1.0"
description = "Open-source modern web browser built with Rust (Tauri v2) and Svelte"
authors = ["Open-Source Contributors"]
edition = "2021"

[lib]
name = "veloce_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
url = "2.5"
window-vibrancy = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tempfile = "3"
tokio = { version = "1", features = ["sync", "macros", "time"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
tauri-plugin-updater = "~2.14.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

