[package]
name = "veloce-browser"
version = "0.1.0"
description = "Open-source modern web browser built with Rust (Tauri v2) and Svelte"
authors = ["Open-Source Contributors"]
edition = "2021"

[lib]
name = "veloce_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
adblock = { version = "0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
tauri = { version = "2", features = ["unstable", "macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
url = "2.5"
window-vibrancy = "0.8"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tempfile = "3"
sha2 = "0.10"
unicode-normalization = "0.1"
base64 = "0.22"
png = "0.17"
getrandom = "0.3"
flate2 = "1.1"
tokio = { version = "1", features = ["sync", "macros", "time", "fs", "io-util"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = ["Devices_Geolocation", "Foundation", "Win32_Security_Credentials", "Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Storage_FileSystem"] }
tauri-plugin-updater = "~2.14.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

# Faster startup and smaller binary: fewer page faults when the executable loads.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

