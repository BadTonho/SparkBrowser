# Flatpak manifest for Spark.
#
# The release workflow builds the application once (the same binary used by the .deb,
# .rpm and AppImage packages), copies it next to this file as `spark-browser`, and
# packs it here. Nothing is compiled by Flatpak itself.
#
# The app id matches the Tauri identifier (`org.spark.browser`) so the window class,
# the desktop file and the icon are associated correctly. Publishing on Flathub would
# need an id under a domain the project controls.
app-id: org.spark.browser
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: spark-browser

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # Downloads are saved to the user's Downloads folder.
  - --filesystem=xdg-download
  # Backup sync credentials are kept in the Secret Service through `secret-tool`.
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications

modules:
  # Provides the `secret-tool` command that Spark runs to store credentials. It is not
  # part of the GNOME runtime.
  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dmanpage=false
      - -Dgtk_doc=false
      - -Dvapi=false
      - -Dintrospection=false
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libsecret/0.21/libsecret-0.21.8.tar.xz
        sha256: 70e7279ccc7e8cce1bb0e1c57a3785e2c79aea6d1dd9a538abda3886f11cdf72

  - name: spark-browser
    buildsystem: simple
    build-commands:
      - install -Dm755 spark-browser /app/bin/spark-browser
      - install -Dm644 org.spark.browser.desktop /app/share/applications/org.spark.browser.desktop
      - install -Dm644 org.spark.browser.metainfo.xml /app/share/metainfo/org.spark.browser.metainfo.xml
      - install -Dm644 icon-128.png /app/share/icons/hicolor/128x128/apps/org.spark.browser.png
      - install -Dm644 icon-256.png /app/share/icons/hicolor/256x256/apps/org.spark.browser.png
    sources:
      # Added by the release workflow, not versioned.
      - type: file
        path: spark-browser
      - type: file
        path: org.spark.browser.desktop
      - type: file
        path: org.spark.browser.metainfo.xml
      - type: file
        path: ../../../src-tauri/icons/128x128.png
        dest-filename: icon-128.png
      - type: file
        path: ../../../src-tauri/icons/128x128@2x.png
        dest-filename: icon-256.png
