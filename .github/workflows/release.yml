name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Run `npm run test:native:critical` locally before creating the tag. The native suite is
# not a gate here: it is a separate manual workflow (native.yml).
jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Run checks & unit tests
        run: |
          npm run check
          npm run test
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and Sign NSIS Package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx @tauri-apps/cli build --bundles nsis

      - name: Generate update manifest & collect artifacts
        run: |
          node tools/release/generate-manifest.mjs ${{ github.ref_name }}

      - name: Package portable Windows zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $stage = "portable/SparkBrowser"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item src-tauri/target/release/spark-browser.exe $stage
          Copy-Item LICENSE $stage
          # Its presence tells the app it is not installed, so it never runs the installer to update itself.
          Set-Content -Path "$stage/portable.txt" -Value "Spark portable. Delete this file only if you install Spark."
          Compress-Archive -Path "$stage/*" -DestinationPath "release-artifacts/SparkBrowser_${version}_x64-portable.zip"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-artifacts/*
          if-no-files-found: error

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev rpm

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Run Linux Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Linux packages (deb, AppImage & rpm)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx @tauri-apps/cli build --bundles deb,appimage,rpm

      - name: Package portable Linux tarball
        run: |
          mkdir -p linux-artifacts
          if [ -f "src-tauri/target/release/spark-browser" ]; then
            tar -czvf linux-artifacts/spark-browser-linux-x86_64-portable.tar.gz -C src-tauri/target/release spark-browser
          fi

      - name: Collect Linux artifacts
        run: |
          mkdir -p linux-artifacts
          find src-tauri/target/release/bundle/ -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" -o -name "*.tar.gz" -o -name "*.sig" \) ! -name control.tar.gz ! -name data.tar.gz -exec cp {} linux-artifacts/ \;
          ls -la linux-artifacts/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: linux-artifacts/*
          if-no-files-found: warn

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist-release

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: dist-release

      - name: List files to be published
        run: ls -la dist-release/

      - name: Create or Update GitHub Release (Draft)
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          prerelease: ${{ contains(github.ref_name, '-beta') }}
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

