<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark actions</title>
    <style>
      :root, html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent !important; }
      body { color: #f5f5f5; font: 12px/1.35 system-ui, sans-serif; }
      #overlay { position: fixed; inset: 0; display: none; pointer-events: none; }
      #menu {
        position: absolute;
        min-width: 176px;
        max-width: min(260px, calc(100vw - 16px));
        display: grid;
        gap: 2px;
        padding: 5px;
        box-sizing: border-box;
        border: 1px solid rgba(229, 229, 229, .2);
        border-radius: 10px;
        background: rgba(16, 16, 16, .97);
        box-shadow: 0 12px 32px rgba(0, 0, 0, .46);
        backdrop-filter: blur(16px);
        pointer-events: auto;
      }
      button {
        width: 100%;
        padding: 8px 10px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #e5e5e5;
        font: 500 12px/1.3 system-ui, sans-serif;
        text-align: left;
        cursor: pointer;
      }
      button:hover, button:focus-visible { outline: none; background: rgba(255, 255, 255, .1); color: #fff; }
      button[data-danger="true"] { color: #fca5a5; }
      button[data-danger="true"]:hover { background: rgba(239, 68, 68, .14); }
    </style>
  </head>
  <body>
    <div id="overlay" aria-hidden="true">
      <div id="menu" role="menu" aria-label="Bookmark actions"></div>
    </div>
    <script>
      (() => {
        const root = document.getElementById("overlay");
        const menu = document.getElementById("menu");
        let activeToken = "";
        let isOpen = false;
        let requestSent = false;

        function sendRequest(action) {
          if (!isOpen || requestSent) return;
          requestSent = true;
          const url = new URL(`veloce-internal://bookmark-context-menu/${action}`);
          url.searchParams.set("token", activeToken);
          window.location.href = url.toString();
        }

        function dismissOutside(event) {
          if (isOpen && !menu.contains(event.target)) sendRequest("dismiss");
        }

        function dismissEscape(event) {
          if (!isOpen || event.key !== "Escape") return;
          event.preventDefault();
          event.stopImmediatePropagation();
          sendRequest("dismiss");
        }

        window.__veloceSetBookmarkContextMenu = (payload) => {
          if (!payload.visible) {
            isOpen = false;
            requestSent = false;
            root.style.display = "none";
            root.setAttribute("aria-hidden", "true");
            return;
          }

          activeToken = payload.token || "";
          requestSent = false;
          isOpen = true;
          root.style.display = "block";
          root.setAttribute("aria-hidden", "false");
          menu.replaceChildren();
          menu.style.backdropFilter = `blur(${Math.min(24, Math.max(0, Number(payload.backdropBlurPx) || 0))}px)`;

          for (const action of payload.actions || []) {
            const button = document.createElement("button");
            button.type = "button";
            button.setAttribute("role", "menuitem");
            button.dataset.danger = String(Boolean(action.danger));
            button.textContent = action.label;
            button.addEventListener("click", (event) => {
              event.preventDefault();
              event.stopPropagation();
              sendRequest(action.id);
            });
            menu.appendChild(button);
          }

          const left = Number(payload.x) || 8;
          const top = Number(payload.y) || 8;
          menu.style.left = `${Math.max(8, Math.min(left, window.innerWidth - menu.offsetWidth - 8))}px`;
          menu.style.top = `${Math.max(8, Math.min(top, window.innerHeight - menu.offsetHeight - 8))}px`;
          menu.querySelector("button")?.focus({ preventScroll: true });
        };

        document.addEventListener("pointerdown", dismissOutside, true);
        window.addEventListener("keydown", dismissEscape, true);
      })();
    </script>
  </body>
</html>
