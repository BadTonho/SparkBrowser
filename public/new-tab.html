<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>New tab</title>
  <link rel="stylesheet" href="/new-tab/page.css">
  <script src="/new-tab/page.js" defer></script>
  <link rel="stylesheet" href="/new-tab/widgets.css">
  <script src="/new-tab/widgets.js" defer></script>
  <link rel="stylesheet" href="/new-tab/wallpaper.css">
  <script src="/new-tab/wallpaper.js" defer></script>
  <link rel="stylesheet" href="/new-tab/clock.css">
  <script src="/new-tab/clock.js" defer></script>
</head>
<body>
  <div id="wallpaper-container" aria-hidden="true" hidden>
    <img id="wallpaper-image" alt="" hidden>
    <video id="wallpaper-video" autoplay loop muted playsinline hidden></video>
    <div id="wallpaper-overlay"></div>
  </div>
  <div id="widgets" hidden>
    <section id="clock-card-widget" class="widget clock-widget clock-card" aria-labelledby="clock-card-heading" hidden>
      <div class="widget-heading"><h2 id="clock-card-heading" data-label="clock"></h2></div>
      <p id="clock-card-greeting" class="clock-greeting" hidden></p>
      <div id="clock-card-time" class="clock-time" aria-live="off"></div>
      <p id="clock-card-date" class="clock-date"></p>
    </section>
    <section id="weather-widget" class="widget" aria-labelledby="weather-heading" hidden>
      <div class="widget-heading"><h2 id="weather-heading"></h2><button id="weather-refresh" type="button" class="icon-button" data-label="refresh">↻</button></div>
      <p id="weather-place"></p>
      <div id="weather-content"></div>
      <p id="weather-status" role="status"></p>
      <button id="weather-locate" type="button" data-label="locate" hidden></button>
      <button id="weather-configure" type="button" data-label="configure" hidden></button>
      <button id="weather-attribution" class="text-button" type="button">Open-Meteo</button>
    </section>
    <section id="gmail-widget" class="widget" aria-labelledby="gmail-heading" hidden>
      <div class="widget-heading"><h2 id="gmail-heading">Gmail</h2><button id="gmail-refresh" type="button" class="icon-button" data-label="refresh">↻</button></div>
      <p id="gmail-account"></p>
      <p id="gmail-unread"></p>
      <ol id="gmail-messages"></ol>
      <p id="gmail-status" role="status"></p>
      <button id="gmail-widget-connect" type="button" data-label="connect"></button>
      <button id="gmail-open" type="button" data-label="openGmail" hidden></button>
    </section>
  </div>
  <main>
    <section class="content" aria-label="Search">
      <section id="clock-top-widget" class="clock-widget clock-top" aria-label="Clock" hidden>
        <p id="clock-top-greeting" class="clock-greeting" hidden></p>
        <div id="clock-top-time" class="clock-time" aria-live="off"></div>
        <p id="clock-top-date" class="clock-date"></p>
      </section>
      <form id="search-form" role="search">
        <input id="search" type="text" autocomplete="off" spellcheck="false" aria-label="Search or enter address" placeholder="Search or enter address">
        <button id="submit" type="submit" aria-label="Search" title="Search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
        </button>
      </form>
      <div id="recent" aria-label="Recent sites"></div>
      <p id="empty" role="status" hidden></p>
      <div id="error" role="status" hidden><span id="error-text"></span> <button id="retry" type="button">Try again</button></div>
      <section id="clock-bottom-widget" class="clock-widget clock-bottom" aria-label="Clock" hidden>
        <p id="clock-bottom-greeting" class="clock-greeting" hidden></p>
        <div id="clock-bottom-time" class="clock-time" aria-live="off"></div>
        <p id="clock-bottom-date" class="clock-date"></p>
      </section>
    </section>
  </main>
  <footer id="customization"><button id="widget-settings" class="icon-button" type="button" aria-controls="settings-panel" aria-expanded="false" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m9 3-.7 2.3-2 .9L4 5.7 2.5 8.3 4 10v2l-1.5 1.7L4 16.3l2.3-.5 2 .9L9 19h3l.7-2.3 2-.9 2.3.5 1.5-2.6L17 12v-2l1.5-1.7L17 5.7l-2.3.5-2-.9L12 3Z" transform="translate(1.5 1)"/><circle cx="12" cy="12" r="3"/></svg></button></footer>
  <dialog id="settings-panel" aria-labelledby="settings-heading">
    <div class="widget-heading">
      <button id="settings-back" type="button" class="icon-button" aria-label="Voltar" data-label="back" hidden>‹</button>
      <h2 id="settings-heading" data-label="settings"></h2>
      <button id="settings-close" type="button" class="icon-button" data-label="close">×</button>
    </div>
    <p id="settings-status" role="status"></p>
    <div id="settings-main-view">
      <nav class="settings-menu-list" role="menu">
        <button id="menu-item-weather" type="button" class="settings-menu-item" data-category="weather" role="menuitem">
          <span class="menu-item-icon" aria-hidden="true">☁️</span>
          <span class="menu-item-label" data-label="weather"></span>
          <span class="menu-item-chevron" aria-hidden="true">›</span>
        </button>
        <button id="menu-item-gmail" type="button" class="settings-menu-item" data-category="gmail" role="menuitem">
          <span class="menu-item-icon" aria-hidden="true">✉️</span>
          <span class="menu-item-label">Gmail</span>
          <span class="menu-item-chevron" aria-hidden="true">›</span>
        </button>
        <button id="menu-item-wallpaper" type="button" class="settings-menu-item" data-category="wallpaper" role="menuitem">
          <span class="menu-item-icon" aria-hidden="true">🖼️</span>
          <span class="menu-item-label" data-label="wallpaper"></span>
          <span class="menu-item-chevron" aria-hidden="true">›</span>
        </button>
        <button id="menu-item-clock" type="button" class="settings-menu-item" data-category="clock" role="menuitem">
          <span class="menu-item-icon" aria-hidden="true">⏰</span>
          <span class="menu-item-label" data-label="clock"></span>
          <span class="menu-item-chevron" aria-hidden="true">›</span>
        </button>
      </nav>
    </div>
    <section id="weather-section" aria-labelledby="weather-settings-heading" hidden>
      <h3 id="weather-settings-heading" data-label="weather"></h3>
      <label class="toggle"><span data-label="showWeather"></span><input id="weather-enabled" type="checkbox"></label>
      <div id="weather-options" hidden>
        <label for="location-mode" data-label="location"></label>
        <select id="location-mode"><option value="manual" data-label="manual"></option><option value="automatic" data-label="automatic"></option></select>
        <div id="manual-location">
          <div class="city-search"><input id="city-query" type="search" autocomplete="off" maxlength="200"><button id="city-search" type="button" data-label="findCity"></button></div>
          <p id="city-status" role="status"></p><div id="city-results"></div><p id="selected-city"></p>
        </div>
        <button id="location-request" type="button" data-label="locate" hidden></button>
        <label for="temperature-unit" data-label="unit"></label>
        <select id="temperature-unit"><option value="celsius">°C</option><option value="fahrenheit">°F</option></select>
      </div>
    </section>
    <section id="gmail-section" aria-labelledby="gmail-settings-heading" hidden>
      <h3 id="gmail-settings-heading">Gmail</h3>
      <label class="toggle"><span data-label="showGmail"></span><input id="gmail-enabled" type="checkbox"></label>
      <div id="gmail-options" hidden>
        <p data-label="gmailDescription"></p><p id="gmail-config-status" role="status"></p>
        <button id="gmail-connect" type="button" data-label="connect"></button>
        <button id="gmail-cancel" type="button" data-label="cancel" hidden></button>
        <button id="gmail-disconnect" type="button" data-label="disconnect" hidden></button>
      </div>
    </section>
    <section id="wallpaper-section" aria-labelledby="wallpaper-settings-heading" hidden>
      <h3 id="wallpaper-settings-heading" data-label="wallpaper"></h3>
      <label class="toggle"><span data-label="showWallpaper"></span><input id="wallpaper-enabled" type="checkbox"></label>
      <div id="wallpaper-options" hidden>
        <div class="wallpaper-actions">
          <input id="wallpaper-file" type="file" accept="image/*,video/mp4,video/webm,video/ogg" hidden>
          <button id="wallpaper-choose" type="button" data-label="chooseWallpaper"></button>
          <button id="wallpaper-remove" type="button" data-label="removeWallpaper" hidden></button>
        </div>
        <p id="wallpaper-status" role="status"></p>
        <div id="wallpaper-preview-wrap" hidden>
          <img id="wallpaper-preview" alt="" hidden>
          <video id="wallpaper-video-preview" muted loop autoplay playsinline hidden></video>
        </div>
        <div class="wallpaper-slider-wrap">
          <label for="wallpaper-dim" data-label="wallpaperDim"></label>
          <div class="wallpaper-slider-row">
            <input id="wallpaper-dim" type="range" min="0" max="90" value="40" step="5">
            <span id="wallpaper-dim-val">40%</span>
          </div>
        </div>
      </div>
    </section>
    <section id="clock-section" aria-labelledby="clock-settings-heading" hidden>
      <h3 id="clock-settings-heading" data-label="clock"></h3>
      <label class="toggle"><span data-label="showClock"></span><input id="clock-enabled" type="checkbox"></label>
      <div id="clock-options" hidden>
        <label for="clock-font" data-label="clockFont"></label>
        <select id="clock-font">
          <option value="system" data-label="clockFontSystem"></option>
          <option value="monospace" data-label="clockFontMonospace"></option>
          <option value="serif" data-label="clockFontSerif"></option>
          <option value="rounded" data-label="clockFontRounded"></option>
          <option value="display" data-label="clockFontDisplay"></option>
        </select>
        <label for="clock-format" data-label="clockFormat"></label>
        <select id="clock-format">
          <option value="24h" data-label="clockFormat24"></option>
          <option value="12h" data-label="clockFormat12"></option>
        </select>
        <label for="clock-position" data-label="clockPosition"></label>
        <select id="clock-position">
          <option value="bottom" data-label="clockPositionBottom"></option>
          <option value="top" data-label="clockPositionTop"></option>
          <option value="card" data-label="clockPositionCard"></option>
        </select>
        <label class="toggle"><span data-label="clockShowSeconds"></span><input id="clock-seconds" type="checkbox"></label>
        <label class="toggle"><span data-label="clockShowDate"></span><input id="clock-date" type="checkbox"></label>
        <label class="toggle"><span data-label="clockShowGreeting"></span><input id="clock-greeting" type="checkbox"></label>
      </div>
    </section>
  </dialog>
</body>
</html>
